services:
  gateway:
    build: .
    restart: unless-stopped
    # Host networking: Ollama escucha solo en loopback del host, y este modo
    # es el mismo patrón que usa el proxy oci_llm. El servicio binda
    # 0.0.0.0:8000 del host: la exposición pública la gobierna UFW, y el
    # acceso está protegido por GATEWAY_API_KEYS.
    network_mode: host
    environment:
      OLLAMA_URL: http://localhost:11434
      GATEWAY_API_KEYS: ${GATEWAY_API_KEYS:?GATEWAY_API_KEYS is required}
      ALLOWED_MODELS: ${ALLOWED_MODELS:-lfm25-8b}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-2}
      QUEUE_TIMEOUT: ${QUEUE_TIMEOUT:-30}
      UPSTREAM_TIMEOUT: ${UPSTREAM_TIMEOUT:-300}
      # "none" inyecta reasoning_effort=none cuando el cliente no lo manda
      # (thinking off por defecto). Vacio/unset resuelve a "none" (compose v2
      # no distingue); "no inyectar" solo queda disponible vía .env local.
      DEFAULT_REASONING_EFFORT: ${DEFAULT_REASONING_EFFORT:-none}
