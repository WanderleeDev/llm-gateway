# Private project network: the gateway and Ollama reach each other by service DNS name.
# A reverse proxy can attach this project to its own network; a service may belong to
# several networks at once.
services:
  ollama:
    image: ollama/ollama:0.40.6
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - llm
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # One-shot: pulls the chat model (qwen3.5:4b, Q4_K_M) from the public Ollama
  # registry into the ollama-data volume. On redeploys the pull is an instant no-op.
  # Keep OLLAMA_CHAT_MODEL in sync with ALLOWED_MODELS: a model the gateway allows
  # but nobody pulled makes every request fail with a 502 from Ollama.
  ollama-init:
    image: ollama/ollama:0.40.6
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # The init CLI must point at the SERVER running in the other container.
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - llm
    # The image ENTRYPOINT is already the binary; no leading "ollama".
    command: ["pull", "${OLLAMA_CHAT_MODEL:-qwen3.5:4b}"]

  # Second one-shot: the embedding model. `ollama pull` accepts a single model
  # per invocation, so each family gets its own service. Both are instant no-ops
  # on redeploys because the weights already live in ollama-data.
  ollama-init-embed:
    image: ollama/ollama:0.40.6
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - llm
    command: ["pull", "${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}"]

  gateway:
    build: .
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      ollama-init-embed:
        condition: service_completed_successfully
    environment:
      # Internal by default (same project); local dev keeps using .env with
      # OLLAMA_URL=http://localhost:11434 against a host Ollama.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      GATEWAY_API_KEYS: ${GATEWAY_API_KEYS:?GATEWAY_API_KEYS is required}
      ALLOWED_MODELS: ${ALLOWED_MODELS:-qwen3.5:4b}
      # Embedding models accepted by /v1/embeddings. Uses "-" instead of ":-" on
      # purpose: an explicitly empty value disables the endpoint, while the
      # other vars above cannot tell empty from unset.
      ALLOWED_EMBEDDING_MODELS: ${ALLOWED_EMBEDDING_MODELS-qwen3-embedding:0.6b}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-2}
      QUEUE_TIMEOUT: ${QUEUE_TIMEOUT:-30}
      UPSTREAM_TIMEOUT: ${UPSTREAM_TIMEOUT:-300}
      # "none" injects reasoning_effort=none when the client omits it
      # (thinking off by default). Empty/unset resolves to "none" (compose v2
      # cannot tell them apart); "inject nothing" is only available via a local .env.
      DEFAULT_REASONING_EFFORT: ${DEFAULT_REASONING_EFFORT:-none}
    networks:
      - llm

volumes:
  ollama-data:

networks:
  llm:
